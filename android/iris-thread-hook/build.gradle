plugins {
    id "com.android.application" version "8.5.2"
}

android {
    namespace "com.bbl.iristhread"
    compileSdk 34

    defaultConfig {
        applicationId "com.bbl.iristhread"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // No signing config: LSPosed loads the module by package, a debug-signed APK is fine.
}

dependencies {
    // Provided by the LSPosed runtime; never bundled. api:82 == xposedminversion in the manifest.
    compileOnly "de.robv.android.xposed:api:82"
}
